name: Release

# Builds the panel and attaches the integration as sip_assistant.zip to every
# published release. HACS installs releases from this zip (see hacs.json).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the zip for (e.g. v0.3.1)
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the panel
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Check that the tag matches the integration version
        run: |
          version="$(jq -r .version custom_components/sip_assistant/manifest.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::manifest.json has version $version, but the release is $TAG"
            exit 1
          fi
      - name: Create the zip
        working-directory: custom_components/sip_assistant
        run: zip -r "$GITHUB_WORKSPACE/sip_assistant.zip" . -x "*__pycache__*"
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" sip_assistant.zip --clobber --repo "$GITHUB_REPOSITORY"
