[project]
name = "ha-sip-assistant"
version = "0.1.0"
description = "Call Home Assistant over SIP: keypad menu and OpenAI voice assistant"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:aiohttp.*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "BLE", "C4", "D", "E", "F", "FLY", "G", "I", "ICN", "INP",
    "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF",
    "S", "SIM", "SLF", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = [
    "D202",    # No blank lines allowed after function docstring
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "D406",
    "D407",
    "E501",    # line length is handled by the formatter
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "S104",    # Binding to all interfaces is intended for a SIP server
    "S311",    # random is fine for RTP port selection
    "TC001", "TC002", "TC003",
    "TID252",  # relative imports inside the integration package are intended
    "TRY003",
    "TRY400",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.sip_assistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109", "ASYNC110", "D", "INP001", "PLC0415", "PT018", "S101", "S324", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
